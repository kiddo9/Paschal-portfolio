<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="#151515"/>
  <rect width="798" height="398" x="1" y="1" rx="15" stroke="#333" stroke-width="2"/>

  <!-- Client Side -->
  <rect x="50" y="150" width="140" height="100" rx="8" fill="#1f1f1f" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="195" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">React Client</text>
  <text x="120" y="215" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="11">TypeScript / gRPC-Web</text>

  <!-- Envoy Proxy -->
  <rect x="250" y="150" width="140" height="100" rx="8" fill="#1f1f1f" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Envoy Proxy</text>
  <text x="320" y="215" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="11">gRPC-Web Bridge</text>

  <!-- Backend -->
  <rect x="450" y="100" width="180" height="200" rx="8" fill="#1f1f1f" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="135" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Go Backend</text>
  <text x="540" y="155" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="11">gRPC Server / Protobuf</text>
  
  <rect x="470" y="180" width="140" height="40" rx="4" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-dasharray="4 4"/>
  <text x="540" y="205" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="12" font-weight="bold">Worker Pool</text>

  <!-- External Services -->
  <rect x="680" y="150" width="100" height="100" rx="8" fill="#1f1f1f" stroke="#6b7280" stroke-width="2"/>
  <text x="730" y="195" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">SMTP/SMS</text>
  <text x="730" y="215" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="11">Providers</text>

  <!-- Arrows -->
  <path d="M190 200 L250 200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M390 200 L450 200" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M630 200 L680 200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Footer Info -->
  <text x="50" y="360" fill="#6b7280" font-family="sans-serif" font-size="12">Infrastructure: Docker Compose | GitHub Actions CI/CD</text>
</svg>
